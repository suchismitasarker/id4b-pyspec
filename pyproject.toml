[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "id4b-pyspec"
version = "0.1.0"
description = "pyspec-based SPEC client utilities for CHESS ID4B"
requires-python = ">=3.9"
dependencies = [
    "chess-pyspec",
]

[project.scripts]
id4b-spec-prompt = "id4b_pyspec.prompt:main"

[tool.setuptools.packages.find]
where = ["src"]
